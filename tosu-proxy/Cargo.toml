[package]
name = "tosu-proxy"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1

[[bin]]
name = "tosu-lyrics"
path = "src/main.rs"

[lints.rust]
unused = "allow"

[dependencies]
lyric-macro = { version = "0.0.1", path = "lyric-macro" }
reqwest = { version = "0.13.2", features = ["charset", "json"] }
rand = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
serde_path_to_error = "0.1.20"
tokio = { version = "1.50.0", features = ["fs", "rt-multi-thread", "process", "sync", "macros"] }
rust-embed = "8.6.0"

async-trait = "0.1.89"
bincode = "2.0.1"
config = "0.15.22"
futures = "0.3.32"
futures-util = "0.3.32"
paste = "1.0.15"
regex = "1.12.3"
salvo = { version = "0.89.3", features = ["default", "serve-static", "websocket"] }
sea-orm = { version = "1.1.19", features = ["sqlx-sqlite", "sqlx-mysql", "sqlx-postgres", "runtime-tokio-native-tls", "debug-print", "macros"] }
sea-orm-migration = { version = "1.1.19", features = ["sqlx-sqlite", "runtime-tokio-native-tls"] }
sea-schema = { version = "0.16.2", features = ["writer"] }
tokio-tungstenite = "0.29.0"
nu-ansi-term = "0.46.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tungstenite = "0.29.0"
