[package]
name = "tosu-proxy"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1

[[bin]]
name = "tosu-lyrics"
path = "src/main.rs"

[lints.rust]
unused = "allow"

[dependencies]
lyric-macro = { version = "0.0.1", path = "lyric-macro" }
reqwest = { version = "0.13.5", features = ["charset", "json"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
serde_path_to_error = "0.1.20"
tokio = { version = "1.53.2", features = ["fs", "rt-multi-thread", "process", "sync", "macros"] }
rust-embed = "8.13.0"

async-trait = "0.1.92"
config = "0.15.27"
futures = "0.3.34"
futures-util = "0.3.34"
regex = "1.13.1"
salvo = { version = "1.0.1", features = ["default", "serve-static", "websocket"] }
sea-orm = { version = "2.0.4", features = ["sqlx-sqlite", "sqlx-mysql", "sqlx-postgres", "runtime-tokio-native-tls", "debug-print", "macros"] }
sea-orm-migration = { version = "2.0.4", features = ["sqlx-sqlite", "runtime-tokio-native-tls"] }
sea-schema = { version = "0.18.1", features = ["writer"] }
tokio-tungstenite = "0.30.0"
nu-ansi-term = "0.50.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "chrono"] }
tracing-appender = "0.2"
tungstenite = "0.30.0"
webbrowser = { version = "1.2.4", default-features = false }
percent-encoding = { version = "2.3.2", default-features = false }
local-ip-address = "0.6"
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }
symphonia = { version = "0.6.1", features = ["all"] }
