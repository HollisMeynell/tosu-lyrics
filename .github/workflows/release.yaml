name: Build and Release

permissions:
  contents: write

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths:
      - 'tosu-proxy/**'
      - 'src/**'
      - 'public/**'
      - 'static/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'justfile'
      - '.github/workflows/**'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-release.zip

          - os: windows-latest
            target: win-release.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tosu-proxy -> target
          shared-key: tosu-lyrics-${{ runner.os }}
          add-job-id-key: false
          cache-on-failure: true

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Build (just package)
        run: just package ./release

      - name: Run upx
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest
          files: release/tosu-lyrics*
          args: --best -q

      - name: Prepare archive
        if: startsWith(github.ref, 'refs/tags/v')
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: 'zip'
          filename: ${{ matrix.target }}
          directory: ./release

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/${{ matrix.target }}
          tag_name: ${{ github.ref_name }}
